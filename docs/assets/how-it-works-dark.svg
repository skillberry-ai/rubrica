<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 214" width="1032" height="214" role="img" aria-labelledby="t d"><title id="t">How a Rubrica run gets from your artifacts to a test suite</title><desc id="d">Left to right: the artifacts you bring, five phases -- select, then understand, then cover, then build, then compile -- and the runnable test suite that comes out. A numbered marker between phases is a gate a human holds; the phase that proposes and scores scenarios loops until coverage stops improving. Each phase lists the stages it covers.</desc><style>
  .bg{fill:#121514}
  .plate{fill:#0D100F;stroke:#272D2A;stroke-width:1}
  .box{fill:#1B1F1D;stroke:#333A36;stroke-width:1}
  .hair{stroke:#272D2A;stroke-width:1}
  .verb{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;font-weight:600;fill:#F79CBC;letter-spacing:1.3px}
  .note{font-family:Charter,"Iowan Old Style","Source Serif 4",Georgia,"Times New Roman",serif;fill:#E7EAE6}
  .stage{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;fill:#7B857F}
  .plabel{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;fill:#7B857F;letter-spacing:1.1px}
  .pitem{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;fill:#E7EAE6}
  .edge{stroke:#7B857F;stroke-width:1.25;fill:none}
  .ar{fill:#7B857F}
  .gate{fill:#F1749F}
  .gnum{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;font-weight:600;fill:#0D100F}
  .glab{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;fill:#F79CBC;letter-spacing:.9px}
  .loop{stroke:#F1749F;stroke-width:1.25;fill:none;opacity:.7}
  .arl{fill:#F1749F;opacity:.7}
  .looplab{font-family:Charter,"Iowan Old Style","Source Serif 4",Georgia,"Times New Roman",serif;font-style:italic;fill:#A2ACA7}
  .cap{font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;fill:#7B857F}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ar"/></marker><marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arl"/></marker></defs><rect width="1032" height="214" class="bg"/><rect x="16" y="52" width="104" height="118" rx="2" class="plate"/><text x="28.0" y="73.0" class="plabel" font-size="9" text-anchor="start">YOU BRING</text><text x="28.0" y="100.0" class="pitem" font-size="11.5" text-anchor="start">specs</text><text x="28.0" y="118.0" class="pitem" font-size="11.5" text-anchor="start">traces</text><text x="28.0" y="136.0" class="pitem" font-size="11.5" text-anchor="start">source</text><line x1="120" y1="111.0" x2="136" y2="111.0" class="edge" marker-end="url(#ar)"/><rect x="136" y="52" width="120" height="118" rx="2" class="box"/><text x="147.0" y="73.0" class="verb" font-size="11" text-anchor="start">SELECT</text><text x="147.0" y="94.0" class="note" font-size="12" text-anchor="start">choose what is</text><text x="147.0" y="108.0" class="note" font-size="12" text-anchor="start">worth reading</text><line x1="147" y1="118" x2="245" y2="118" class="hair"/><text x="147.0" y="134.0" class="stage" font-size="11.5" text-anchor="start">survey</text><text x="147.0" y="148.0" class="stage" font-size="11.5" text-anchor="start">triage</text><text x="147.0" y="162.0" class="stage" font-size="11.5" text-anchor="start">triage-slices</text><text x="147.0" y="176.0" class="stage" font-size="11.5" text-anchor="start">triage-objective</text><text x="147.0" y="190.0" class="stage" font-size="11.5" text-anchor="start">triage-seal</text><line x1="256" y1="111.0" x2="263.0" y2="111.0" class="edge" marker-end="url(#ar)"/><circle cx="276.0" cy="111.0" r="10" class="gate"/><text x="276.0" y="115.2" class="gnum" font-size="12" text-anchor="middle">0</text><text x="276.0" y="135.0" class="glab" font-size="8.5" text-anchor="middle">GATE</text><line x1="289.0" y1="111.0" x2="296" y2="111.0" class="edge" marker-end="url(#ar)"/><rect x="296" y="52" width="120" height="118" rx="2" class="box"/><text x="307.0" y="73.0" class="verb" font-size="11" text-anchor="start">UNDERSTAND</text><text x="307.0" y="94.0" class="note" font-size="12" text-anchor="start">one world model</text><text x="307.0" y="108.0" class="note" font-size="12" text-anchor="start">of claims</text><line x1="307" y1="118" x2="405" y2="118" class="hair"/><text x="307.0" y="134.0" class="stage" font-size="11.5" text-anchor="start">intake</text><text x="307.0" y="148.0" class="stage" font-size="11.5" text-anchor="start">extract</text><text x="307.0" y="162.0" class="stage" font-size="11.5" text-anchor="start">reconcile</text><line x1="416" y1="111.0" x2="423.0" y2="111.0" class="edge" marker-end="url(#ar)"/><circle cx="436.0" cy="111.0" r="10" class="gate"/><text x="436.0" y="115.2" class="gnum" font-size="12" text-anchor="middle">1</text><text x="436.0" y="135.0" class="glab" font-size="8.5" text-anchor="middle">GATE</text><line x1="449.0" y1="111.0" x2="456" y2="111.0" class="edge" marker-end="url(#ar)"/><rect x="456" y="52" width="120" height="118" rx="2" class="box"/><text x="467.0" y="73.0" class="verb" font-size="11" text-anchor="start">COVER</text><text x="467.0" y="94.0" class="note" font-size="12" text-anchor="start">scenarios, round</text><text x="467.0" y="108.0" class="note" font-size="12" text-anchor="start">after round</text><line x1="467" y1="118" x2="565" y2="118" class="hair"/><text x="467.0" y="134.0" class="stage" font-size="11.5" text-anchor="start">propose</text><text x="467.0" y="148.0" class="stage" font-size="11.5" text-anchor="start">score</text><path d="M562 52 C 562 26, 470 26, 470 52" class="loop" marker-end="url(#arl)"/><text x="516.0" y="24.0" class="looplab" font-size="11" text-anchor="middle">until coverage stops improving</text><line x1="576" y1="111.0" x2="583.0" y2="111.0" class="edge" marker-end="url(#ar)"/><circle cx="596.0" cy="111.0" r="10" class="gate"/><text x="596.0" y="115.2" class="gnum" font-size="12" text-anchor="middle">2</text><text x="596.0" y="135.0" class="glab" font-size="8.5" text-anchor="middle">GATE</text><line x1="609.0" y1="111.0" x2="616" y2="111.0" class="edge" marker-end="url(#ar)"/><rect x="616" y="52" width="120" height="118" rx="2" class="box"/><text x="627.0" y="73.0" class="verb" font-size="11" text-anchor="start">BUILD</text><text x="627.0" y="94.0" class="note" font-size="12" text-anchor="start">concrete tests,</text><text x="627.0" y="108.0" class="note" font-size="12" text-anchor="start">then attack each</text><line x1="627" y1="118" x2="725" y2="118" class="hair"/><text x="627.0" y="134.0" class="stage" font-size="11.5" text-anchor="start">instantiate</text><text x="627.0" y="148.0" class="stage" font-size="11.5" text-anchor="start">challenge</text><line x1="736" y1="111.0" x2="743.0" y2="111.0" class="edge" marker-end="url(#ar)"/><circle cx="756.0" cy="111.0" r="10" class="gate"/><text x="756.0" y="115.2" class="gnum" font-size="12" text-anchor="middle">3</text><text x="756.0" y="135.0" class="glab" font-size="8.5" text-anchor="middle">GATE</text><line x1="769.0" y1="111.0" x2="776" y2="111.0" class="edge" marker-end="url(#ar)"/><rect x="776" y="52" width="120" height="118" rx="2" class="box"/><text x="787.0" y="73.0" class="verb" font-size="11" text-anchor="start">COMPILE</text><text x="787.0" y="94.0" class="note" font-size="12" text-anchor="start">build the suite,</text><text x="787.0" y="108.0" class="note" font-size="12" text-anchor="start">then run it once</text><line x1="787" y1="118" x2="885" y2="118" class="hair"/><text x="787.0" y="134.0" class="stage" font-size="11.5" text-anchor="start">emit</text><text x="787.0" y="148.0" class="stage" font-size="11.5" text-anchor="start">smoke</text><line x1="896" y1="111.0" x2="912" y2="111.0" class="edge" marker-end="url(#ar)"/><rect x="912" y="52" width="104" height="118" rx="2" class="plate"/><text x="924.0" y="73.0" class="plabel" font-size="9" text-anchor="start">YOU GET</text><text x="924.0" y="109.0" class="pitem" font-size="11.5" text-anchor="start">a runnable</text><text x="924.0" y="127.0" class="pitem" font-size="11.5" text-anchor="start">test suite</text><circle cx="23.0" cy="194" r="5" class="gate"/><text x="36.0" y="198.0" class="cap" font-size="11.5" text-anchor="start">a gate you hold — nothing moves past it until you say so</text><line x1="456.4" y1="194" x2="467.4" y2="194" class="edge" marker-end="url(#ar)"/><text x="474.4" y="198.0" class="cap" font-size="11.5" text-anchor="start">every arrow is a file on disk, never a message between stages</text></svg>
