version: 2
updates:
  # Python dependencies (uv-managed; Dependabot reads pyproject.toml / uv.lock)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore

  # GitHub Actions used in our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
    ignore:
      # We reference actions by floating major tag (e.g. codeql-action@v4,
      # checkout@v7), so minor/patch releases are picked up automatically at
      # run time. Dependabot cannot see that and would otherwise open a PR for
      # every patch (v4 -> 4.37.4), which *narrows* the ref and adds churn.
      # Major bumps (v4 -> v5) still come through, since those need a review.
      #
      # Every action the workflows reference that way is listed, not just the
      # first one written down: an omitted entry gets exactly the narrowing PR
      # this block exists to prevent, on the first weekly run.
      # tests/unit/test_github_workflows.py fails when the two drift apart, so
      # add the entry here when you add a floating-ref action to a workflow.
      - dependency-name: github/codeql-action
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/checkout
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/dependency-review-action
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: astral-sh/setup-uv
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      # Pinned to the `release/v1` branch rather than a tag, so there is no
      # semver stream for Dependabot to bump at all. Listed anyway: the entry
      # costs nothing and keeps the block a complete statement of the policy
      # rather than one that silently omits the odd case.
      - dependency-name: pypa/gh-action-pypi-publish
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
