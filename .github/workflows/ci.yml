name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --extra dev

      # `uv sync --extra dev` provisions this project's own environment,
      # including the `dev` extra (ruff, pytest) -- there is no lockfile
      # committed, so this is a real sync, not a no-op. Every gate below
      # passes `--extra dev` again on the `uv run` that invokes it: a bare
      # `uv run` re-syncs to just the base dependencies before running,
      # silently dropping ruff/pytest from that invocation's environment.
      # The three gates run in the order CONTRIBUTING.md names them. The
      # live-dispatch test suite is deliberately excluded here: it
      # dispatches a model, so it needs credentials and would cost money on
      # every push.
      - name: Lint and format
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

      - name: Tests
        run: uv run --extra dev pytest -q

      - name: Skill contracts
        run: uv run --extra dev rubrica check-skills
