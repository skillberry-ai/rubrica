name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the workflow level rather than per job. Nothing in CI writes
# to the repository: the gates read the tree, and the DCO job reads history. Set
# here so a job added later is constrained by default instead of inheriting the
# repository-wide token permissions.
permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    # Only a pull request has a base to diff against; a direct push to main has
    # no meaningful range to check. This is also why a branch ruleset requiring a
    # pull request is needed for this job to bind -- without one, a direct push
    # bypasses the check entirely rather than failing it.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check walks the PR's commits, so it needs their history, not just
          # the tip. Without this the merge-base lookup fails and the script
          # exits 1 with "cannot resolve base ref".
          fetch-depth: 0

      - name: Check DCO sign-off
        run: ./scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --extra dev --locked

      # `uv sync --extra dev` provisions this project's own environment,
      # including the `dev` extra (ruff, pytest), from the committed uv.lock --
      # so this job installs the same pins `make setup` gives a contributor.
      # `--locked` is what makes that a guarantee rather than a hope: it fails
      # if uv.lock is out of date with pyproject.toml, where a bare `uv sync`
      # would silently re-resolve and update the lock in CI, defeating the pin
      # invisibly. If this step fails on a stale lock, run `uv lock` and commit
      # the result. Each gate below repeats `--extra dev` on its own `uv run` so
      # that every step is self-sufficient. Measured: a bare `uv run` after this
      # sync does *not* prune the extra -- ruff survives in .venv/bin and still
      # runs -- so the flag is belt-and-braces against a step being reordered,
      # run on its own, or reached with an environment this job did not create,
      # rather than a workaround for pruning. The gates run in the order
      # CONTRIBUTING.md names them. The live-dispatch test suite is deliberately
      # excluded here: it dispatches a model, so it needs credentials and would
      # cost money on every push.
      - name: Lint and format
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

      - name: Tests
        run: uv run --extra dev pytest -q

      - name: Skill contracts
        run: uv run --extra dev rubrica check-skills

  # The pre-commit hooks over the whole tree. Its own job, not a step in `check`,
  # and the split is the point: the default-branch ruleset requires `check` and
  # `DCO` by name, so a step there would make the hooks a fourth gate, which
  # CONTRIBUTING.md and .pre-commit-config.yaml both say they are not. A job of its
  # own reports red on the PR without blocking the merge; requiring it is a
  # ruleset change, made on purpose, not a side effect of this file.
  #
  # Why it runs at all: the hooks were local-only and run per commit on staged
  # files, so the browser console, never run with `--all-files`, landed three
  # failing hooks on main with every gate green.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --extra dev --locked

      # pre-commit installs each hook from its pinned rev on first run; uncached,
      # so this job pays that once per run rather than adding an action to pin.
      # `--show-diff-on-failure` because a rewriting hook (trailing whitespace,
      # end of file, ruff) fails by editing the checkout, and the diff is the
      # only place a reader of the log sees what it wanted.
      - name: Hooks
        run: uv run --extra dev pre-commit run --all-files --show-diff-on-failure
