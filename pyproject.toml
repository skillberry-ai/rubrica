[project]
name = "rubrica"
version = "0.1.0"
description = "Skill-based test suite generator for agentic systems"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
rubrica = "rubrica.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The schemas are the contract, so they ship with the package: without this a
# wheel installs code that cannot validate anything. The skills are the
# pipeline's producers, and for the same reason: an installed copy that can
# validate and emit but cannot find its own skills is a copy that cannot run.
[tool.setuptools.package-data]
rubrica = ["schema/*.json", "suite/*.py", "suite/*.sh", "skills/*/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Ruff formats Python code blocks inside Markdown. The specs and plans under
# docs/ are prose records whose code blocks are illustrative and laid out for
# reading; a formatter must not rewrite a committed design document. The code
# that matters is transcribed into src/ and tests/, where ruff does apply.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: dispatches a model; skipped unless TESTGEN_LIVE is set (see tests/conftest.py)",
]
