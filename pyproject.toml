[project]
name = "rubrica"
version = "0.1.0"
description = "Skill-based test suite generator for agentic systems"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jonathan Bnayahu", email = "bnayahu@il.ibm.com"}]
keywords = ["agents", "testing", "test-generation", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.23",
    # Transitive through jsonschema today, but validate.py imports it directly
    # (Registry, Resource, DRAFT202012) to resolve the part schemas' cross-file
    # $refs, so it earns its own declaration rather than riding jsonschema's.
    "referencing>=0.35",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
# ruff is capped, pytest is not, and the asymmetry is the point: `ruff format`
# output changes across minor releases, so uncapped, `ruff format --check .` can
# go red on a push containing no code change at all. uv.lock is what actually
# prevents that now -- it is committed, and both `make setup` and CI install
# through `uv sync`, so contributor and CI get the same pins. The cap is kept as
# the belt to that braces: it bounds what `uv lock --upgrade` can pull in, so a
# formatter bump has to be a deliberate widening of this line rather than a
# side effect of refreshing the lock.
dev = ["pytest>=8.3", "ruff>=0.8,<0.17"]

[project.scripts]
rubrica = "rubrica.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The schemas are the contract, so they ship with the package: without this a
# wheel installs code that cannot validate anything. The skills are the
# pipeline's producers, and for the same reason: an installed copy that can
# validate and emit but cannot find its own skills is a copy that cannot run.
[tool.setuptools.package-data]
rubrica = ["schema/*.json", "suite/*.py", "suite/*.sh", "skills/*/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Ruff formats Python code blocks inside Markdown. Everything under docs/ is
# prose -- documentation whose code blocks are laid out for reading, and dated
# build records under docs/superpowers/ that are history and must stay verbatim.
# A formatter must not rewrite either. The code that matters is in src/ and
# tests/, where ruff does apply.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: dispatches a model; skipped unless RUBRICA_LIVE is set (see tests/conftest.py)",
]
